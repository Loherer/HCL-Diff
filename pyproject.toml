[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcl-diff"
version = "0.1.0"
description = "Cross-slice-consistent local 2.5D diffusion augmentation for hepatic lesion CT segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "scipy",
  "scikit-image",
  "torch",
]

[project.optional-dependencies]
medical = ["dynamic-network-architectures", "monai"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

